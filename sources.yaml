# Every dataset you want to use goes here.
# The merge script ignores each dataset's own train/valid/test split and re-splits
# everything by VIDEO / ORIGINAL IMAGE, so near-identical frames never leak into the test set.

# The classes your final model will learn (order = class id).
classes: [shahed, bird, other_aircraft]

split:
  val: 0.15        # fraction of groups that go to validation
  test: 0.15       # fraction of REAL groups that go to test (synthetic is never in test)
  seed: 42

sources:
  # Example 1: synthetic renders (download as "YOLOv8" format from Roboflow, unzip here)
  - name: render
    path: data/raw/shahed136-detect
    domain: synthetic          # synthetic -> train/val only, never test
    group_by: image            # image = each render is independent
    class_map:                 # source class name -> your class name. Unlisted classes are dropped.
      "1": shahed

  # Example 2: "Target Detection - Shahed" by Mariam Aljaberi (CC BY 4.0 - credit the author!)
  # This ONE folder holds two kinds of images, split by file name:
  #   random-letter names (~2,833) = renders  -> train/val only
  #   numbered names 0001_... (49) = REAL     -> all go to test (honest real-world benchmark)
  - name: aljaberi_render
    path: data/raw/target-detection-shahed
    domain: synthetic
    exclude: '^\d+_'          # everything that does NOT start with a number
    group_by: image
    class_map:
      shahed: shahed

  - name: aljaberi_real
    path: data/raw/target-detection-shahed
    domain: real
    include: '^\d+_'          # only files that start with a number (0001_, 0002_ ...)
    group_by: block:50
    test: 1.0                  # all 49 real images -> test. Lower this once you have more real data.
    class_map:
      shahed: shahed

  # Birds by EvilSUmrak (CC BY 4.0 - credit the author!). REAL video frames of flying birds,
  # many small/far away. Teaches "bird is not a Shahed" and lets us MEASURE false alarms.
  - name: birds_evilsumrak
    path: data/raw/birds-evilsumrak
    domain: real
    group_by: video            # frames like pexels-...-6942723_mp4-4 -> one group per video
    class_map:
      "- bird": bird

  # Example 3: multi-class dataset with confusers
  - name: hlyx
    path: data/raw/shahed-136-hlyx
    domain: real
    group_by: video
    class_map:
      shahed: shahed
      bird: bird
      helicopter: other_aircraft

  # Example 4: hard negatives = images with NO target (paper planes, kites, sky, planes...)
  # Just put images in this folder. No label files needed. They teach the model "this is NOT a Shahed".
  - name: negatives
    path: data/raw/negatives
    domain: real
    class_map: {}
